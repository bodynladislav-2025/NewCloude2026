name: Deploy payments app to GitHub Pages

on:
  push:
    branches: [claude/monthly-payments-app-qrnt65]
    paths:
      - 'payments/**'
      - '.github/workflows/deploy-payments.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: payments/package-lock.json
      - run: npm ci
        working-directory: payments
      - run: npx vite build --base=/NewCloude2026/
        working-directory: payments
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: payments/dist
      - id: deployment
        uses: actions/deploy-pages@v4
